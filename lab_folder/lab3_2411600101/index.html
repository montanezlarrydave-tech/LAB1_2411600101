<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>
<body>

    <div class="container">
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.js"> </script>

    <script src="Js/login.js"></script>

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card shadow-lg" style="max-width: 400px; width: 100%;">
           
        </div>
    </div>

    </div class="cash-header bg-primary text-white text-center py-4">
         <h2 class="mb-0"> lala </h2>
         <p class="mb-0 small">login to your dashboard</p>
    </div>
     

<div class="card-body p-4 p-md-5">
  <h5 class="text-center mb-4 fw-semibold">Sign in to your account</h5>

  <div id="loginAlert" class="alert d-none" role="alert"></div>

  <form id="loginForm" novalidate>
    
    <div class="mb-3">
      <label for="username" class="form-label">Username</label>
      <div class="input-group">
        <span class="input-group-text bg-light">
          <i class="bi bi-person-fill text-primary"></i>
        </span>
        <input type="text" 
               class="form-control" 
               id="username" 
               placeholder="Enter username" 
               required 
               autocomplete="username">
      </div>
    </div>


    <div class="mb-4">
      <label for="password" class="form-label">Password</label>
      <div class="input-group">
        <span class="input-group-text bg-light">
          <i class="bi bi-lock-fill text-primary"></i>
        </span>
        <input type="password" 
               class="form-control" 
               id="password" 
               placeholder="Enter password" 
               required 
               autocomplete="current-password">
      </div>
    </div>

    <div class="d-grid">
      <button type="button" id="loginBtn" class="btn btn-primary btn-lg login-btn">
        <i class="bi bi-box-arrow-in-right me-2"></i>Login
      </button>
    </div>

  </form>

  <div class="mt-4 text-center">
    <small class="text-muted">
      Demo credentials: <strong>admin</strong> / <strong>password123</strong>
    </small>
  </div>
</div>


<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">
            theme name
        </a>
        <button class="navbar-loggler" type="button" data-bs-tonggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-tonggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <span class="navbar-text text-white me-3" id="userDisplay">
                        Welcome, <span id="username">User</span>
                    </span>                    
                </li>
                <li class="nav-item">
                    <button class="btn btn-outline-light btn-sm" id="lagoutBtn">Lagout</button>
                </li>
            </ul>
        </div>
    </div>
</nav>
   

</body>
</html>
